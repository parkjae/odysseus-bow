<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Odysseus Bow - Elastic Ring Pull</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays */
        .ui-header {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            opacity: 0.85;
            transition: opacity 0.3s ease;
        }

        .ui-header h1 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .ui-header p {
            font-size: 0.85rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 8px;
            letter-spacing: 0.1em;
        }

        .audio-prompt {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .audio-prompt:active {
            transform: translateX(-50%) scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.4; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div class="ui-header" id="uiHeader">
        <h1>ODYSSEUS BOW</h1>
        <p id="guideText">하단 링을 클릭하여 상단 점까지 끌어 올려보세요</p>
    </div>

    <div id="canvas-container">
        <canvas id="bowCanvas"></canvas>
    </div>

    <div class="audio-prompt" id="audioPrompt">
        <div class="pulse-dot"></div>
        <span id="promptText">화면을 터치하여 사운드 활성화</span>
    </div>

    <script>
        // ----------------------------------------------------
        // Web Audio API Setup & Audio Preloading
        // ----------------------------------------------------
        let audioCtx = null;
        let bow1Buffer = null;
        let bow2Buffer = null;
        let isAudioLoaded = false;
        let isUnlocked = false;

        const audioPrompt = document.getElementById('audioPrompt');
        const promptText = document.getElementById('promptText');

        function unlockAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (!isUnlocked && audioCtx) {
                try {
                    const buffer = audioCtx.createBuffer(1, 1, 22050);
                    const source = audioCtx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(audioCtx.destination);
                    source.start(0);
                    isUnlocked = true;

                    if (isAudioLoaded) {
                        promptText.textContent = "준비 완료: 링을 당겨보세요";
                        setTimeout(() => {
                            audioPrompt.style.opacity = '0.3';
                        }, 2000);
                    }
                } catch(e) {
                    console.warn('Audio unlock error:', e);
                }
            }
        }

        async function loadSounds() {
            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                }

                const [res1, res2] = await Promise.all([
                    fetch('bow_1.mp3'),
                    fetch('bow_2.mp3')
                ]);

                if (!res1.ok || !res2.ok) throw new Error('Failed to load bow audio files');

                const [ab1, ab2] = await Promise.all([
                    res1.arrayBuffer(),
                    res2.arrayBuffer()
                ]);

                bow1Buffer = await audioCtx.decodeAudioData(ab1);
                bow2Buffer = await audioCtx.decodeAudioData(ab2);
                isAudioLoaded = true;

                if (isUnlocked) {
                    promptText.textContent = "준비 완료: 링을 당겨보세요";
                } else {
                    promptText.textContent = "화면을 터치하여 사운드 활성화";
                }
            } catch (err) {
                console.warn('Sound loading error, fallback synthetic sound enabled:', err);
                promptText.textContent = "오디오 준비됨 (합성 음원)";
                isAudioLoaded = false;
            }
        }

        loadSounds();

        audioPrompt.addEventListener('click', unlockAudio);
        audioPrompt.addEventListener('touchstart', unlockAudio, { passive: true });

        function playSound(buffer, fallbackFreq = 300) {
            unlockAudio();
            const now = audioCtx ? audioCtx.currentTime : 0;

            if (audioCtx && buffer && isAudioLoaded) {
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;

                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.9, now);

                source.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                source.start(now);
            } else if (audioCtx) {
                // Synthetic fallback
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(fallbackFreq, now);
                osc.frequency.exponentialRampToValueAtTime(fallbackFreq * 1.5, now + 0.15);

                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        function playBow1Sound() {
            playSound(bow1Buffer, 320);
        }

        function playBow2Sound() {
            playSound(bow2Buffer, 480);
        }

        // ----------------------------------------------------
        // Canvas Setup & Elastic Ring Simulation
        // ----------------------------------------------------
        const canvas = document.getElementById('bowCanvas');
        const ctx = canvas.getContext('2d');

        let width = 0;
        let height = 0;

        // Position Constants
        let targetX = 0;
        let targetY = 0; // Top 1/3 point
        let baseRingX = 0;
        let baseRingY = 0; // Bottom position

        // Current Ring State
        let ringX = 0;
        let ringY = 0;
        let ringVx = 0;
        let ringVy = 0;
        let ringRadius = 22;

        let isDragging = false;

        // Sound Trigger Flags (Triggered when pulling up past 1/3 and 2/3 progress)
        let triggeredStep1 = false; // 1/3 point
        let triggeredStep2 = false; // 2/3 point

        // Particles Effect System
        let particles = [];

        class Particle {
            constructor(x, y, color = '#ffffff') {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.size = Math.random() * 3 + 1.5;
                this.color = color;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.015;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createBurst(x, y, count = 20, color = '#ffffff') {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;

            targetX = width / 2;
            targetY = height / 3; // Top 1/3 location

            baseRingX = width / 2;
            baseRingY = height * 0.85; // Bottom location

            if (!isDragging) {
                ringX = baseRingX;
                ringY = baseRingY;
                ringVx = 0;
                ringVy = 0;
            }
        }

        // ----------------------------------------------------
        // Mouse & Touch Interaction
        // ----------------------------------------------------
        function handlePointerDown(e) {
            unlockAudio();

            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            const dx = clientX - ringX;
            const dy = clientY - ringY;
            const dist = Math.sqrt(dx * dx + dy * dy);

            // Check if user clicked/touched inside or near Ring (Hitbox: radius + 25px)
            if (dist <= ringRadius + 25) {
                isDragging = true;
                ringVx = 0;
                ringVy = 0;
            }
        }

        function handlePointerMove(e) {
            if (!isDragging) return;

            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            // Follow pointer
            ringX = clientX;
            ringY = clientY;

            // Calculate progress towards top 1/3 target point (0.0 to 1.0)
            const totalDistance = baseRingY - targetY;
            const currentDistance = baseRingY - ringY;
            const progress = Math.min(Math.max(currentDistance / totalDistance, 0), 1.0);

            // Trigger 1/3 point (33% progress) -> Play bow_1.mp3
            if (progress >= 0.333 && !triggeredStep1) {
                triggeredStep1 = true;
                playBow1Sound();
                createBurst(ringX, ringY, 15, 'rgba(255, 255, 255, 0.9)');
            }

            // Trigger 2/3 point (66% progress) -> Play bow_2.mp3
            if (progress >= 0.666 && !triggeredStep2) {
                triggeredStep2 = true;
                playBow2Sound();
                createBurst(ringX, ringY, 25, '#ffffff');
            }

            // Arrived at destination (Top 1/3 Dot) burst effect
            if (progress >= 0.98) {
                createBurst(targetX, targetY, 4, '#ffffff');
            }
        }

        function handlePointerUp() {
            if (isDragging) {
                isDragging = false;
                // Reset trigger flags upon release for next pull
                triggeredStep1 = false;
                triggeredStep2 = false;
            }
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        window.addEventListener('touchstart', (e) => {
            unlockAudio();
            handlePointerDown(e);
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                if (e.cancelable) e.preventDefault();
            }
            handlePointerMove(e);
        }, { passive: false });

        window.addEventListener('touchend', handlePointerUp);

        // Initial setup
        resize();

        window.addEventListener('click', unlockAudio, { once: true });
        window.addEventListener('touchstart', unlockAudio, { once: true, passive: true });

        // ----------------------------------------------------
        // Animation Loop & Physics Rendering
        // ----------------------------------------------------
        let time = 0;

        function animate() {
            time += 0.03;

            // Clear Background
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, width, height);

            // Soft radial ambient glow around target area
            const bgGlow = ctx.createRadialGradient(targetX, targetY, 0, targetX, targetY, width * 0.4);
            bgGlow.addColorStop(0, 'rgba(255, 255, 255, 0.03)');
            bgGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = bgGlow;
            ctx.fillRect(0, 0, width, height);

            // Elastic Snap-Back Physics when ring is released
            if (!isDragging) {
                // Spring force pulling back to baseRingX, baseRingY
                const fx = (baseRingX - ringX) * 0.08;
                const fy = (baseRingY - ringY) * 0.08;

                ringVx += fx;
                ringVy += fy;

                ringVx *= 0.88; // Damping
                ringVy *= 0.88;

                ringX += ringVx;
                ringY += ringVy;
            }

            // Draw Elastic Cord / String (From Top Target Dot to Bottom Ring)
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(targetX, targetY);

            // Add subtle tension curve when stretched
            const midX = (targetX + ringX) / 2;
            const midY = (targetY + ringY) / 2;
            const stretchDist = Math.hypot(ringX - targetX, ringY - targetY);
            
            // Draw elastic string with glow
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = Math.max(1.5, 6 - stretchDist / 150);
            ctx.shadowBlur = 18;
            ctx.shadowColor = '#ffffff';
            ctx.lineTo(ringX, ringY);
            ctx.stroke();

            // Core crisp white inner line
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(1, 2.5 - stretchDist / 300);
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ffffff';
            ctx.stroke();
            ctx.restore();

            // Draw 1/3 and 2/3 Guide Indicator Lines (Subtle guide dots)
            const y13 = baseRingY - (baseRingY - targetY) * 0.333;
            const y23 = baseRingY - (baseRingY - targetY) * 0.666;

            ctx.save();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.beginPath();
            ctx.arc(targetX, y13, 3, 0, Math.PI * 2);
            ctx.arc(targetX, y23, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Draw Top 1/3 Target Dot (Destination Dot with pulsing aura)
            ctx.save();
            const pulseScale = 1 + Math.sin(time * 2) * 0.2;
            
            // Outer aura
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.beginPath();
            ctx.arc(targetX, targetY, 14 * pulseScale, 0, Math.PI * 2);
            ctx.fill();

            // Solid inner dot
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ffffff';
            ctx.beginPath();
            ctx.arc(targetX, targetY, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Draw White Ring (At ringX, ringY)
            ctx.save();
            ctx.lineWidth = 3.5;
            ctx.strokeStyle = '#ffffff';
            ctx.fillStyle = isDragging ? 'rgba(255, 255, 255, 0.2)' : 'rgba(255, 255, 255, 0.05)';
            ctx.shadowBlur = isDragging ? 25 : 15;
            ctx.shadowColor = '#ffffff';

            ctx.beginPath();
            ctx.arc(ringX, ringY, ringRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Inner Accent Ring
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.beginPath();
            ctx.arc(ringX, ringY, ringRadius - 6, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            // Update & Render Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
