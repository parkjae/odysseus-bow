<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Odysseus String - Pluck String</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays */
        .ui-header {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            opacity: 0.85;
            transition: opacity 0.3s ease;
        }

        .ui-header h1 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .ui-header p {
            font-size: 0.85rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 8px;
            letter-spacing: 0.1em;
            transition: color 0.3s ease;
        }

        .audio-prompt {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .audio-prompt:active {
            transform: translateX(-50%) scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.4; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div class="ui-header" id="uiHeader">
        <h1>ODYSSEUS STRING</h1>
        <p id="guideText">세로 선을 클릭하거나 터치하여 좌우로 당겼다 놓아보세요</p>
    </div>

    <div id="canvas-container">
        <canvas id="bowCanvas"></canvas>
    </div>

    <div class="audio-prompt" id="audioPrompt">
        <div class="pulse-dot"></div>
        <span id="promptText">화면을 터치하여 사운드 활성화</span>
    </div>

    <script>
        // ----------------------------------------------------
        // Web Audio API Setup & Mobile Unlock
        // ----------------------------------------------------
        let audioCtx = null;
        let pluckBuffer = null;
        let isAudioLoaded = false;
        let isUnlocked = false;

        let currentAudioSource = null;
        let currentGainNode = null;

        const audioPrompt = document.getElementById('audioPrompt');
        const promptText = document.getElementById('promptText');

        // Mobile iOS/Android Web Audio Unlock
        function unlockAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Play silent buffer to unlock audio hardware on iOS / Mobile browsers
            if (!isUnlocked && audioCtx) {
                try {
                    const buffer = audioCtx.createBuffer(1, 1, 22050);
                    const source = audioCtx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(audioCtx.destination);
                    source.start(0);
                    isUnlocked = true;

                    if (isAudioLoaded) {
                        promptText.textContent = "준비 완료: 줄을 당겼다 놓으세요";
                        setTimeout(() => {
                            audioPrompt.style.opacity = '0.3';
                        }, 2000);
                    }
                } catch(e) {
                    console.warn('Audio unlock silent play error:', e);
                }
            }
        }

        // Load pluck.mp3 file
        async function loadSound() {
            try {
                const response = await fetch('pluck.mp3');
                if (!response.ok) throw new Error('Failed to load audio file');
                const arrayBuffer = await response.arrayBuffer();
                
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                }

                pluckBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                isAudioLoaded = true;

                if (isUnlocked) {
                    promptText.textContent = "준비 완료: 줄을 당겼다 놓으세요";
                } else {
                    promptText.textContent = "화면을 터치하여 사운드 활성화";
                }
            } catch (err) {
                console.warn('pluck.mp3 로드 실패, 합성 음원 모드로 전환합니다:', err);
                promptText.textContent = "오디오 준비됨 (합성 음원)";
                isAudioLoaded = false;
            }
        }

        loadSound();

        // Audio Prompt Banner Explicit Click / Touch
        audioPrompt.addEventListener('click', unlockAudio);
        audioPrompt.addEventListener('touchstart', unlockAudio, { passive: true });

        // Fade out current audio smoothly over fadeTime seconds
        function stopCurrentAudioSlowly(fadeTime = 0.25) {
            if (currentGainNode && audioCtx) {
                const now = audioCtx.currentTime;
                const gain = currentGainNode;
                const src = currentAudioSource;

                try {
                    gain.gain.cancelScheduledValues(now);
                    gain.gain.setValueAtTime(gain.gain.value, now);
                    gain.gain.linearRampToValueAtTime(0.0001, now + fadeTime);

                    setTimeout(() => {
                        try { src.stop(); } catch(e) {}
                    }, fadeTime * 1000);
                } catch(e) {}

                currentGainNode = null;
                currentAudioSource = null;
            }
        }

        function playPluckSound(intensity = 1.0) {
            unlockAudio();
            stopCurrentAudioSlowly(0.05);

            const now = audioCtx ? audioCtx.currentTime : 0;
            const volume = Math.min(Math.max(intensity, 0.15), 1.0);

            if (audioCtx && pluckBuffer && isAudioLoaded) {
                const source = audioCtx.createBufferSource();
                source.buffer = pluckBuffer;

                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(volume, now);

                source.playbackRate.setValueAtTime(1.0, now);

                source.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                source.start(now);

                currentAudioSource = source;
                currentGainNode = gainNode;
            } else if (audioCtx) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                const freq = 220;
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.5, now + 0.1);

                gain.gain.setValueAtTime(volume, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.6);

                currentAudioSource = osc;
                currentGainNode = gain;
            }
        }

        // ----------------------------------------------------
        // Canvas & Physics Simulation (Vertical String)
        // ----------------------------------------------------
        const canvas = document.getElementById('bowCanvas');
        const ctx = canvas.getContext('2d');

        let width = 0;
        let height = 0;
        let centerX = 0;

        // String Physics Nodes
        const NUM_NODES = 60;
        let nodes = [];
        let stringMargin = 80;

        // State Flags
        let isVibrating = false;  // String is currently oscillating
        let isResetting = false;  // Transitioning to complete rest/reset

        class Node {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.baseX = x;
                this.vx = 0;
                this.pinned = false;
            }

            update(stiffness = 0.08, damping = 0.94) {
                if (this.pinned) return;
                
                const forceX = (this.baseX - this.x) * stiffness;
                this.vx += forceX;
                this.vx *= damping;
                this.x += this.vx;
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;

            stringMargin = Math.min(height * 0.1, 100);
            initNodes();
        }

        function initNodes() {
            nodes = [];
            const usableHeight = height - stringMargin * 2;
            const step = usableHeight / (NUM_NODES - 1);

            for (let i = 0; i < NUM_NODES; i++) {
                const y = stringMargin + i * step;
                const node = new Node(centerX, y);
                if (i === 0 || i === NUM_NODES - 1) {
                    node.pinned = true;
                }
                nodes.push(node);
            }
        }

        // Particle System
        let particles = [];

        class Particle {
            constructor(x, y, vxSpeed = 0) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 6 + vxSpeed * 0.2;
                this.vy = (Math.random() - 0.5) * 6;
                this.size = Math.random() * 3 + 1;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.015;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function emitParticles(x, y, count = 15, vxSpeed = 0) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, vxSpeed));
            }
        }

        // ----------------------------------------------------
        // Mouse & Touch Interactions (Click / Touch Required)
        // ----------------------------------------------------
        let isDragging = false;
        let dragNodeIndex = -1;
        let mouseX = 0;
        let mouseY = 0;

        const HOVER_THRESHOLD = 45;

        function getClosestNodeIndex(y) {
            let closestDist = Infinity;
            let index = -1;
            for (let i = 1; i < NUM_NODES - 1; i++) {
                const dist = Math.abs(nodes[i].y - y);
                if (dist < closestDist) {
                    closestDist = dist;
                    index = i;
                }
            }
            return index;
        }

        function handlePointerDown(e) {
            unlockAudio();

            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            mouseX = clientX;
            mouseY = clientY;

            // If user inputs while string is vibrating/moving -> Stop audio, dampen motion, and RESET state
            if (isVibrating || isResetting) {
                stopCurrentAudioSlowly(0.25);
                
                isResetting = true;
                isVibrating = false;
                isDragging = false;
                dragNodeIndex = -1;

                for (let i = 1; i < NUM_NODES - 1; i++) {
                    nodes[i].vx *= 0.15;
                }
                return;
            }

            // Only grab when user specifically clicks / touches on the string area
            if (mouseY >= stringMargin && mouseY <= height - stringMargin) {
                const closestIdx = getClosestNodeIndex(mouseY);
                if (closestIdx !== -1) {
                    const node = nodes[closestIdx];
                    if (Math.abs(node.x - mouseX) < HOVER_THRESHOLD) {
                        isDragging = true;
                        dragNodeIndex = closestIdx;
                    }
                }
            }
        }

        function handlePointerMove(e) {
            if (!isDragging || dragNodeIndex === -1 || isResetting) {
                return;
            }

            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            mouseX = clientX;
            mouseY = clientY;

            const deltaX = mouseX - centerX;

            const radius = 15;
            for (let i = 1; i < NUM_NODES - 1; i++) {
                const dist = Math.abs(i - dragNodeIndex);
                if (dist < radius) {
                    const factor = Math.cos((dist / radius) * (Math.PI / 2));
                    nodes[i].x = centerX + deltaX * factor;
                    nodes[i].vx = 0;
                }
            }
        }

        function handlePointerUp() {
            if (isResetting) {
                return;
            }

            if (isDragging && dragNodeIndex !== -1) {
                const grabbedNode = nodes[dragNodeIndex];
                const displacement = Math.abs(grabbedNode.x - centerX);

                if (displacement > 5) {
                    const intensity = Math.min(displacement / (width * 0.25), 1.0);

                    playPluckSound(intensity);
                    emitParticles(grabbedNode.x, grabbedNode.y, 20, grabbedNode.vx);

                    isVibrating = true;
                    isResetting = false;
                }

                isDragging = false;
                dragNodeIndex = -1;
            }
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        // Mobile touch events with passive: false to prevent mobile pull-to-refresh
        window.addEventListener('touchstart', (e) => {
            unlockAudio();
            handlePointerDown(e);
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                if (e.cancelable) e.preventDefault();
            }
            handlePointerMove(e);
        }, { passive: false });

        window.addEventListener('touchend', handlePointerUp);

        // Initial setup
        resize();

        // Global first tap audio unlocker
        window.addEventListener('click', unlockAudio, { once: true });
        window.addEventListener('touchstart', unlockAudio, { once: true, passive: true });

        // ----------------------------------------------------
        // Animation Loop & Render
        // ----------------------------------------------------
        function animate() {
            // Dark background
            ctx.fillStyle = 'rgba(5, 5, 8, 0.4)';
            ctx.fillRect(0, 0, width, height);

            const bgGlow = ctx.createRadialGradient(centerX, height / 2, 0, centerX, height / 2, height * 0.4);
            bgGlow.addColorStop(0, 'rgba(255, 255, 255, 0.025)');
            bgGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = bgGlow;
            ctx.fillRect(0, 0, width, height);

            const stiffness = isResetting ? 0.15 : 0.08;
            const dampingFactor = isResetting ? 0.65 : 0.94;

            // Update String Physics
            if (!isDragging) {
                for (let i = 1; i < NUM_NODES - 1; i++) {
                    nodes[i].update(stiffness, dampingFactor);
                }

                for (let pass = 0; pass < 2; pass++) {
                    for (let i = 1; i < NUM_NODES - 1; i++) {
                        const diffPrev = nodes[i - 1].x - nodes[i].x;
                        const diffNext = nodes[i + 1].x - nodes[i].x;
                        nodes[i].vx += (diffPrev + diffNext) * (isResetting ? 0.01 : 0.08);
                    }
                }

                if (isVibrating || isResetting) {
                    let maxDisplacement = 0;
                    let maxVelocity = 0;

                    for (let i = 1; i < NUM_NODES - 1; i++) {
                        const disp = Math.abs(nodes[i].x - nodes[i].baseX);
                        const vel = Math.abs(nodes[i].vx);
                        if (disp > maxDisplacement) maxDisplacement = disp;
                        if (vel > maxVelocity) maxVelocity = vel;
                    }

                    if (maxDisplacement < 0.2 && maxVelocity < 0.05) {
                        for (let i = 1; i < NUM_NODES - 1; i++) {
                            nodes[i].x = nodes[i].baseX;
                            nodes[i].vx = 0;
                        }
                        isVibrating = false;
                        isResetting = false;
                    }
                }
            } else {
                for (let i = 1; i < NUM_NODES - 1; i++) {
                    if (Math.abs(i - dragNodeIndex) > 15) {
                        nodes[i].update(stiffness, dampingFactor);
                    }
                }
            }

            // Draw Vertical String Glow
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(nodes[0].x, nodes[0].y);

            for (let i = 0; i < NUM_NODES - 1; i++) {
                const xc = (nodes[i].x + nodes[i + 1].x) / 2;
                const yc = (nodes[i].y + nodes[i + 1].y) / 2;
                ctx.quadraticCurveTo(nodes[i].x, nodes[i].y, xc, yc);
            }
            ctx.lineTo(nodes[NUM_NODES - 1].x, nodes[NUM_NODES - 1].y);

            ctx.strokeStyle = isVibrating ? 'rgba(255, 255, 255, 0.35)' : 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 8;
            ctx.shadowBlur = isVibrating ? 25 : 20;
            ctx.shadowColor = '#ffffff';
            ctx.stroke();

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.5;
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ffffff';
            ctx.stroke();
            ctx.restore();

            // Draw Fixed Endpoints
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ffffff';

            ctx.beginPath();
            ctx.arc(nodes[0].x, nodes[0].y, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(nodes[NUM_NODES - 1].x, nodes[NUM_NODES - 1].y, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Render Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
