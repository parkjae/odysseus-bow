<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Odysseus's Bow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays */
        .ui-header {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            opacity: 0.85;
            transition: opacity 0.8s ease;
            white-space: nowrap;
            max-width: 90vw;
        }

        .ui-header h1 {
            font-size: clamp(1.1rem, 5.5vw, 1.6rem);
            font-weight: 400;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.35);
            white-space: nowrap;
        }

        .sub-caption {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 6px;
            transition: all 0.5s ease;
            white-space: nowrap;
        }

        .ui-header p {
            font-size: 0.85rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 6px;
            letter-spacing: 0.12em;
            transition: color 0.5s ease;
            white-space: nowrap;
        }

        /* Centered Eye-Catching Golden Audio Prompt (Before Unlock) */
        .audio-prompt {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            background: rgba(229, 180, 9, 0.14);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(229, 180, 9, 0.5);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: clamp(0.72rem, 3.4vw, 0.88rem);
            font-weight: 600;
            letter-spacing: 0.12em;
            color: #FFF2C2;
            text-shadow: 0 0 10px rgba(229, 180, 9, 0.5);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            white-space: nowrap;
            max-width: 92vw;
            width: max-content;
            transition: all 0.6s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 25px rgba(229, 180, 9, 0.25);
        }

        .audio-prompt:hover {
            background: rgba(229, 180, 9, 0.25);
            border-color: rgba(229, 180, 9, 0.8);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 35px rgba(229, 180, 9, 0.45);
        }

        .audio-prompt:active {
            transform: translate(-50%, -50%) scale(0.95);
            background: rgba(229, 180, 9, 0.35);
        }

        /* Unlocked State (Reverts to Original White Style for Step Prompts) */
        .audio-prompt.unlocked {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-weight: 400;
            text-shadow: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .audio-prompt.unlocked:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.35);
        }

        .pulse-dot {
            width: 9px;
            height: 9px;
            flex-shrink: 0;
            background-color: #E5B409;
            border-radius: 50%;
            box-shadow: 0 0 12px #E5B409;
            transition: all 0.6s ease;
            animation: pulse 1.5s infinite;
        }

        .audio-prompt.unlocked .pulse-dot {
            background-color: #ffffff;
            box-shadow: 0 0 10px #ffffff;
            animation: pulse-white 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 8px #E5B409; }
            50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 18px #E5B409; }
            100% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 8px #E5B409; }
        }

        @keyframes pulse-white {
            0% { transform: scale(0.95); opacity: 0.4; box-shadow: 0 0 6px #ffffff; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 14px #ffffff; }
            100% { transform: scale(0.95); opacity: 0.4; box-shadow: 0 0 6px #ffffff; }
        }

        /* Reload Control Button (Scene 2 only) */
        .reload-btn {
            position: absolute;
            right: 30px;
            bottom: 30px;
            z-index: 20;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .reload-btn.visible {
            opacity: 0.85;
            pointer-events: auto;
        }

        .reload-btn:hover {
            opacity: 1;
            transform: rotate(90deg) scale(1.08);
            background: rgba(229, 180, 9, 0.25);
            border-color: rgba(229, 180, 9, 0.5);
            color: #E5B409;
            box-shadow: 0 0 20px rgba(229, 180, 9, 0.4);
        }

        .reload-btn:active {
            transform: rotate(180deg) scale(0.95);
        }

        .reload-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="ui-header" id="uiHeader">
        <h1>ODYSSEUS'S BOW</h1>
        <div class="sub-caption" id="subCaption">STRING A BOW</div>
        <p id="guideText"></p>
    </div>

    <div id="canvas-container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <div class="audio-prompt" id="audioPrompt">
        <div class="pulse-dot"></div>
        <span id="promptText">화면을 터치하여 사운드 활성화</span>
    </div>

    <button class="reload-btn" id="reloadBtn" title="String a bow 단계로 돌아가기">
        <svg viewBox="0 0 24 24">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
    </button>

    <script>
        // ----------------------------------------------------
        // Web Audio API Setup & Preloading
        // ----------------------------------------------------
        let audioCtx = null;
        let compressorNode = null;
        let bow1Buffer = null;
        let bow2Buffer = null;
        let pluckBuffer = null;
        let harpBuffer = null;
        let isAudioLoaded = false;
        let isUnlocked = false;

        let currentAudioSource = null;
        let currentGainNode = null;
        let bow2SourceNode = null; // Reference for bow_2.mp3 source node
        let isBow2Finished = false;

        const audioPrompt = document.getElementById('audioPrompt');
        const promptText = document.getElementById('promptText');
        const subCaption = document.getElementById('subCaption');
        const guideText = document.getElementById('guideText');
        const reloadBtn = document.getElementById('reloadBtn');

        // Pitch Rates
        const FIRST_SEMITONE_DOWN_RATE = Math.pow(2, -1 / 12);
        const SECOND_SEMITONE_DOWN_RATE = Math.pow(2, 4 / 12);
        const THIRD_SEMITONE_DOWN_RATE = Math.pow(2, 3 / 12);
        const MAIN_SEMITONES_DOWN_RATE = Math.pow(2, 1 / 12);

        // Silent WAV Base64 Data URI (0.05s) to override iOS Mute Switch
        const SILENT_WAV_BASE64 = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
        let silentAudioEl = null;

        // Initialize AudioContext and DynamicsCompressor (Limiter)
        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }

            if (audioCtx && !compressorNode) {
                try {
                    // Limiter Setup: Prevents speaker clipping & distortion on mobile devices
                    compressorNode = audioCtx.createDynamicsCompressor();
                    compressorNode.threshold.setValueAtTime(-12, audioCtx.currentTime); // -12dB threshold
                    compressorNode.knee.setValueAtTime(30, audioCtx.currentTime);
                    compressorNode.ratio.setValueAtTime(12, audioCtx.currentTime); // 12:1 ratio limiting
                    compressorNode.attack.setValueAtTime(0.003, audioCtx.currentTime); // 3ms attack
                    compressorNode.release.setValueAtTime(0.25, audioCtx.currentTime); // 250ms release

                    compressorNode.connect(audioCtx.destination);
                } catch(e) {
                    console.warn('Compressor setup failed:', e);
                }
            }

            return audioCtx;
        }

        // Hybrid iOS Audio Session Unlock (AudioSession API + Silent Audio Hack)
        function enableIOSAudioSession() {
            // Method 1: Modern Web Audio Session API (iOS 17+)
            if (navigator.audioSession) {
                try {
                    navigator.audioSession.type = 'playback';
                } catch(e) {}
            }

            // Method 2: HTML5 Silent Audio Element Hack for iOS Mute Switch Override (All iOS versions)
            if (!silentAudioEl) {
                try {
                    silentAudioEl = new Audio();
                    silentAudioEl.src = SILENT_WAV_BASE64;
                    silentAudioEl.setAttribute('playsinline', 'true');
                    silentAudioEl.setAttribute('webkit-playsinline', 'true');
                } catch(e) {}
            }

            if (silentAudioEl) {
                silentAudioEl.play().then(() => {
                    silentAudioEl.pause();
                }).catch(() => {});
            }
        }

        function unlockAudio() {
            enableIOSAudioSession();
            initAudioContext();

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (!isUnlocked && audioCtx) {
                try {
                    const buffer = audioCtx.createBuffer(1, 1, 22050);
                    const source = audioCtx.createBufferSource();
                    source.buffer = buffer;
                    const dest = compressorNode || audioCtx.destination;
                    source.connect(dest);
                    source.start(0);
                    isUnlocked = true;

                    // Apply unlocked class to revert style to original subtle white
                    audioPrompt.classList.add('unlocked');

                    if (isAudioLoaded) {
                        if (currentScene === SCENE_BOW) {
                            promptText.textContent = isBowCompleted ? "준비 완료" : "활 시위를 걸어보세요";
                        } else if (currentScene === SCENE_STRING) {
                            promptText.textContent = "활 시위를 당겨보세요";
                        }
                    }
                } catch(e) {
                    console.warn('Audio unlock error:', e);
                }
            }
        }

        async function loadAllSounds() {
            try {
                initAudioContext();

                const [res1, res2, resPluck, resHarp] = await Promise.all([
                    fetch('bow_1.mp3'),
                    fetch('bow_2.mp3'),
                    fetch('pluck.mp3'),
                    fetch('harp.mp3')
                ]);

                if (!res1.ok || !res2.ok || !resPluck.ok || !resHarp.ok) {
                    throw new Error('Failed to load audio files');
                }

                const [ab1, ab2, abPluck, abHarp] = await Promise.all([
                    res1.arrayBuffer(),
                    res2.arrayBuffer(),
                    resPluck.arrayBuffer(),
                    resHarp.arrayBuffer()
                ]);

                bow1Buffer = await audioCtx.decodeAudioData(ab1);
                bow2Buffer = await audioCtx.decodeAudioData(ab2);
                pluckBuffer = await audioCtx.decodeAudioData(abPluck);
                harpBuffer = await audioCtx.decodeAudioData(abHarp);

                isAudioLoaded = true;

                if (isUnlocked) {
                    audioPrompt.classList.add('unlocked');
                    if (currentScene === SCENE_BOW) {
                        promptText.textContent = isBowCompleted ? "준비 완료" : "활 시위를 걸어보세요";
                    } else if (currentScene === SCENE_STRING) {
                        promptText.textContent = "활 시위를 당겨보세요";
                    }
                } else {
                    promptText.textContent = "화면을 터치하여 사운드 활성화";
                }
            } catch (err) {
                console.warn('Sound load warning, synthetic fallbacks active:', err);
                promptText.textContent = "오디오 준비됨 (합성 음원)";
                isAudioLoaded = false;
            }
        }

        loadAllSounds();

        audioPrompt.addEventListener('click', unlockAudio);
        audioPrompt.addEventListener('touchstart', unlockAudio, { passive: true });

        function stopCurrentAudioSlowly(fadeTime = 0.25) {
            if (currentGainNode && audioCtx) {
                const now = audioCtx.currentTime;
                const gain = currentGainNode;
                const src = currentAudioSource;

                try {
                    gain.gain.cancelScheduledValues(now);
                    gain.gain.setValueAtTime(gain.gain.value, now);
                    gain.gain.linearRampToValueAtTime(0.0001, now + fadeTime);

                    setTimeout(() => {
                        try { src.stop(); } catch(e) {}
                    }, fadeTime * 1000);
                } catch(e) {}

                currentGainNode = null;
                currentAudioSource = null;
            }
        }

        // Playbuffer function routed to DynamicsCompressor
        function playBufferSound(buffer, fallbackFreq = 300, duration = 1.0, playbackRate = 1.0, volumeScale = 1.0) {
            unlockAudio();
            const now = audioCtx ? audioCtx.currentTime : 0;
            const outputDestination = compressorNode || (audioCtx ? audioCtx.destination : null);

            if (audioCtx && buffer && isAudioLoaded) {
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.playbackRate.setValueAtTime(playbackRate, now);

                const gainNode = audioCtx.createGain();
                // 5ms Micro Fade-In Attack: Completely eliminates audio start click/pop noise
                gainNode.gain.setValueAtTime(0.0001, now);
                gainNode.gain.linearRampToValueAtTime(volumeScale, now + 0.005);

                source.connect(gainNode);
                gainNode.connect(outputDestination);

                source.start(now);
                currentAudioSource = source;
                currentGainNode = gainNode;
                return source;
            } else if (audioCtx) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                const shiftedFreq = fallbackFreq * playbackRate;
                osc.frequency.setValueAtTime(shiftedFreq, now);
                osc.frequency.exponentialRampToValueAtTime(shiftedFreq * 1.2, now + 0.2);

                gain.gain.setValueAtTime(volumeScale, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                osc.connect(gain);
                gain.connect(outputDestination);

                osc.start(now);
                osc.stop(now + duration);
                currentAudioSource = osc;
                currentGainNode = gain;
                return osc;
            }
            return null;
        }

        // ----------------------------------------------------
        // State Machine & Scenes Setup
        // ----------------------------------------------------
        const SCENE_BOW = 0;        // Scene 1: String a bow
        const SCENE_TRANSITION = 1; // Smooth fade transition
        const SCENE_STRING = 2;     // Scene 2: Pluck a bow

        let currentScene = SCENE_BOW;
        let transitionProgress = 0;

        // Canvas Setup
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        let width = 0;
        let height = 0;

        // ----------------------------------------------------
        // Scene 1 (BOW) Variables
        // ----------------------------------------------------
        let targetX = 0;
        let targetY = 0;
        let baseRingX = 0;
        let baseRingY = 0;
        let bottomAnchorX = 0;
        let bottomAnchorY = 0;

        let ringX = 0;
        let ringY = 0;
        let ringVx = 0;
        let ringVy = 0;
        let ringRadius = 22;

        let isDraggingRing = false;
        let triggeredStep1 = false;
        let triggeredStep2 = false;
        let isBowCompleted = false;

        // ----------------------------------------------------
        // Scene 2 (STRING) Physics Nodes & Variables
        // ----------------------------------------------------
        const NUM_NODES = 60;
        let nodes = [];
        let stringTopY = 0;
        let stringBottomY = 0;
        let centerX = 0;

        let isDraggingString = false;
        let dragNodeIndex = -1;
        let isStringVibrating = false;
        let isStringResetting = false;

        class Node {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.baseX = x;
                this.vx = 0;
                this.pinned = false;
            }

            update(stiffness = 0.08, damping = 0.94) {
                if (this.pinned) return;
                const forceX = (this.baseX - this.x) * stiffness;
                this.vx += forceX;
                this.vx *= damping;
                this.x += this.vx;
            }
        }

        // Particle System
        let particles = [];

        class Particle {
            constructor(x, y, color = '#E5B409') {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.size = Math.random() * 3 + 1.5;
                this.color = color;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.015;
            }

            update() {
                this.x += this.vx;
                this.alpha -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createBurst(x, y, count = 20, color = '#E5B409') {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;

            targetX = width / 2;
            targetY = height * 0.2;

            baseRingX = width / 2;
            baseRingY = height * 0.9;

            bottomAnchorX = width / 2;
            bottomAnchorY = height;

            if (!isDraggingRing && !isBowCompleted) {
                ringX = baseRingX;
                ringY = baseRingY;
            } else if (isBowCompleted) {
                ringX = targetX;
                ringY = targetY;
            }

            centerX = width / 2;
            stringTopY = height * 0.2;
            stringBottomY = height * 0.9;
            initStringNodes();
        }

        function initStringNodes() {
            nodes = [];
            const usableHeight = stringBottomY - stringTopY;
            const step = usableHeight / (NUM_NODES - 1);

            for (let i = 0; i < NUM_NODES; i++) {
                const y = stringTopY + i * step;
                const node = new Node(centerX, y);
                if (i === 0 || i === NUM_NODES - 1) {
                    node.pinned = true;
                }
                nodes.push(node);
            }
        }

        function getClosestNodeIndex(y) {
            let closestDist = Infinity;
            let index = -1;
            for (let i = 1; i < NUM_NODES - 1; i++) {
                const dist = Math.abs(nodes[i].y - y);
                if (dist < closestDist) {
                    closestDist = dist;
                    index = i;
                }
            }
            return index;
        }

        // ----------------------------------------------------
        // Transition Handlers
        // ----------------------------------------------------
        function transitionToStringScene() {
            currentScene = SCENE_TRANSITION;
            let fadeOut = 0;

            const transitionInterval = setInterval(() => {
                fadeOut += 0.04;
                transitionProgress = fadeOut;

                if (fadeOut >= 1.0) {
                    clearInterval(transitionInterval);

                    currentScene = SCENE_STRING;
                    transitionProgress = 1.0;

                    subCaption.textContent = "PLUCK A BOW";
                    subCaption.style.color = "#E5B409";
                    guideText.textContent = "";

                    if (isUnlocked) {
                        audioPrompt.classList.add('unlocked');
                        promptText.textContent = "활 시위를 당겨보세요";
                    }

                    reloadBtn.classList.add('visible');

                    let fadeIn = 1.0;
                    const fadeInInterval = setInterval(() => {
                        fadeIn -= 0.04;
                        transitionProgress = fadeIn;
                        if (fadeIn <= 0) {
                            clearInterval(fadeInInterval);
                            transitionProgress = 0;
                        }
                    }, 20);
                }
            }, 20);
        }

        function resetToBowScene() {
            if (currentScene === SCENE_TRANSITION) return;

            stopCurrentAudioSlowly(0.2);
            reloadBtn.classList.remove('visible');
            currentScene = SCENE_TRANSITION;

            let fadeOut = 0;
            const transitionInterval = setInterval(() => {
                fadeOut += 0.04;
                transitionProgress = fadeOut;

                if (fadeOut >= 1.0) {
                    clearInterval(transitionInterval);

                    isBowCompleted = false;
                    isDraggingRing = false;
                    triggeredStep1 = false;
                    triggeredStep2 = false;
                    bow2SourceNode = null;
                    isBow2Finished = false;
                    ringX = baseRingX;
                    ringY = baseRingY;
                    ringVx = 0;
                    ringVy = 0;

                    isDraggingString = false;
                    isStringVibrating = false;
                    isStringResetting = false;
                    dragNodeIndex = -1;
                    initStringNodes();

                    currentScene = SCENE_BOW;
                    transitionProgress = 1.0;

                    subCaption.textContent = "STRING A BOW";
                    subCaption.style.color = "rgba(255, 255, 255, 0.7)";
                    guideText.textContent = "";

                    if (isUnlocked) {
                        audioPrompt.classList.add('unlocked');
                        promptText.textContent = "활 시위를 걸어보세요";
                    }

                    let fadeIn = 1.0;
                    const fadeInInterval = setInterval(() => {
                        fadeIn -= 0.04;
                        transitionProgress = fadeIn;
                        if (fadeIn <= 0) {
                            clearInterval(fadeInInterval);
                            transitionProgress = 0;
                        }
                    }, 20);
                }
            }, 20);
        }

        // Prevent reload button touches/clicks from triggering canvas string plucking
        ['mousedown', 'touchstart', 'mouseup', 'touchend', 'click'].forEach(eventType => {
            reloadBtn.addEventListener(eventType, (e) => {
                e.stopPropagation();
            }, { passive: false });
        });

        reloadBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetToBowScene();
        });

        // FOREPLAY: 1st, 2nd & 3rd Pluck Prelude Sequence using harp.mp3 sound at 100% volume
        function playForeplaySequence() {
            promptText.textContent = "준비 완료";

            const soundBuffer = harpBuffer || pluckBuffer;

            // 1st Foreplay Pluck (harp.mp3 at 100% Volume)
            playBufferSound(soundBuffer, 220, 0.8, FIRST_SEMITONE_DOWN_RATE, 1.0);
            createBurst(targetX, targetY, 20, '#E5B409');

            // 2nd Foreplay Pluck (harp.mp3 at 100% Volume)
            setTimeout(() => {
                playBufferSound(soundBuffer, 220, 0.8, SECOND_SEMITONE_DOWN_RATE, 1.0);
                createBurst(targetX, targetY, 30, '#E5B409');

                // 3rd Foreplay Pluck (harp.mp3 at 100% Volume)
                setTimeout(() => {
                    playBufferSound(soundBuffer, 220, 0.8, THIRD_SEMITONE_DOWN_RATE, 1.0);
                    createBurst(targetX, targetY, 35, '#E5B409');

                    // Transition smoothly to Scene 2 (PLUCK A BOW) after 3rd foreplay finishes
                    setTimeout(() => {
                        transitionToStringScene();
                    }, 100);
                }, 1000);
            }, 900);
        }

        // ----------------------------------------------------
        // Pointer & Touch Handlers
        // ----------------------------------------------------
        let mouseX = 0;
        let mouseY = 0;

        function handlePointerDown(e) {
            // Block all dragging interactions until the user presses "화면을 터치하여 사운드 활성화"
            if (!isUnlocked) {
                return;
            }

            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            mouseX = clientX;
            mouseY = clientY;

            if (currentScene === SCENE_BOW) {
                if (isBowCompleted) return;

                const dx = clientX - ringX;
                const dy = clientY - ringY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist <= ringRadius + 30) {
                    isDraggingRing = true;
                    ringVx = 0;
                    ringVy = 0;
                }
            } else if (currentScene === SCENE_STRING) {
                // Allow rapid continuous plucking without audio fade-out blocking
                const clampedY = Math.min(Math.max(mouseY, stringTopY), stringBottomY);
                const closestIdx = getClosestNodeIndex(clampedY);
                if (closestIdx !== -1) {
                    isDraggingString = true;
                    dragNodeIndex = closestIdx;
                    isStringVibrating = false;
                    isStringResetting = false;
                }
            }
        }

        function handlePointerMove(e) {
            if (!isUnlocked) return;

            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            mouseX = clientX;
            mouseY = clientY;

            if (currentScene === SCENE_BOW) {
                if (!isDraggingRing || isBowCompleted) return;

                ringX = clientX;
                ringY = clientY;

                const totalDistance = baseRingY - targetY;
                const currentDistance = baseRingY - ringY;
                const progress = Math.min(Math.max(currentDistance / totalDistance, 0), 1.0);

                // 1/5 point (20.0%) -> Play bow_1.mp3 at 50% volume (0.5)
                if (progress >= 0.20 && !triggeredStep1) {
                    triggeredStep1 = true;
                    playBufferSound(bow1Buffer, 320, 1.2, 1.0, 0.5);
                    createBurst(ringX, ringY, 15, 'rgba(255, 255, 255, 0.9)');
                }

                // 3/5 point (60.0%) -> Play bow_2.mp3 at 50% volume (0.5) with onended listener
                if (progress >= 0.60 && !triggeredStep2) {
                    triggeredStep2 = true;
                    isBow2Finished = false;
                    bow2SourceNode = playBufferSound(bow2Buffer, 480, 1.2, 1.0, 0.5);

                    if (bow2SourceNode) {
                        bow2SourceNode.onended = () => {
                            isBow2Finished = true;
                        };
                    } else {
                        setTimeout(() => { isBow2Finished = true; }, 1200);
                    }
                    createBurst(ringX, ringY, 25, '#ffffff');
                }

                if (progress >= 0.98 && !isBowCompleted) {
                    isBowCompleted = true;
                    isDraggingRing = false;

                    ringX = targetX;
                    ringY = targetY;
                    ringVx = 0;
                    ringVy = 0;

                    createBurst(targetX, targetY, 40, '#E5B409');

                    promptText.textContent = "준비 완료";

                    // Trigger Foreplay sequence after bow_2.mp3 finishes
                    if (isBow2Finished || !bow2SourceNode) {
                        playForeplaySequence();
                    } else {
                        bow2SourceNode.onended = () => {
                            isBow2Finished = true;
                            playForeplaySequence();
                        };
                    }
                }
            } else if (currentScene === SCENE_STRING) {
                if (!isDraggingString || dragNodeIndex === -1 || isStringResetting) return;

                const deltaX = mouseX - centerX;

                for (let i = 1; i < NUM_NODES - 1; i++) {
                    let norm = 0;
                    if (i <= dragNodeIndex) {
                        norm = i / dragNodeIndex;
                    } else {
                        norm = (NUM_NODES - 1 - i) / (NUM_NODES - 1 - dragNodeIndex);
                    }
                    
                    const splineFactor = Math.sin(norm * (Math.PI / 2));
                    nodes[i].x = centerX + deltaX * splineFactor;
                    nodes[i].vx = 0;
                }
            }
        }

        function handlePointerUp() {
            if (!isUnlocked) return;

            if (currentScene === SCENE_BOW) {
                if (isDraggingRing && !isBowCompleted) {
                    isDraggingRing = false;
                    triggeredStep1 = false;
                    triggeredStep2 = false;
                }
            } else if (currentScene === SCENE_STRING) {
                if (isStringResetting) return;

                if (isDraggingString && dragNodeIndex !== -1) {
                    const grabbedNode = nodes[dragNodeIndex];
                    const displacement = Math.abs(grabbedNode.x - centerX);

                    if (displacement > 5) {
                        // Dynamic Volume calculation: Min 50% (0.5), Max 120% (1.2) based on pull displacement
                        const maxPull = Math.min(width * 0.25, 140);
                        const pullRatio = Math.min(Math.max((displacement - 5) / (maxPull - 5), 0.0), 1.0);
                        const dynamicVolume = 0.5 + (1.2 - 0.5) * pullRatio;

                        // Polyphonic multi-sound triggering with DynamicsCompressorLimiter routing
                        playBufferSound(pluckBuffer, 220, 0.8, MAIN_SEMITONES_DOWN_RATE, dynamicVolume);
                        createBurst(grabbedNode.x, grabbedNode.y, 25, '#E5B409');

                        isStringVibrating = true;
                        isStringResetting = false;
                    }

                    isDraggingString = false;
                    dragNodeIndex = -1;
                }
            }
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        window.addEventListener('touchstart', (e) => {
            handlePointerDown(e);
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (isDraggingRing || isDraggingString) {
                if (e.cancelable) e.preventDefault();
            }
            handlePointerMove(e);
        }, { passive: false });

        window.addEventListener('touchend', handlePointerUp);

        // Initial setup
        resize();

        // ----------------------------------------------------
        // Render & Animation Loop
        // ----------------------------------------------------
        let time = 0;

        function animate() {
            time += 0.03;

            // Clear Canvas
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, width, height);

            // SCENE 1: BOW RENDER
            if (currentScene === SCENE_BOW || currentScene === SCENE_TRANSITION) {
                const bgGlow = ctx.createRadialGradient(targetX, targetY, 0, targetX, targetY, width * 0.4);
                bgGlow.addColorStop(0, 'rgba(255, 255, 255, 0.03)');
                bgGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = bgGlow;
                ctx.fillRect(0, 0, width, height);

                if (!isDraggingRing && !isBowCompleted) {
                    const fx = (baseRingX - ringX) * 0.08;
                    const fy = (baseRingY - ringY) * 0.08;
                    ringVx += fx;
                    ringVy += fy;
                    ringVx *= 0.88;
                    ringVy *= 0.88;
                    ringX += ringVx;
                    ringY += ringVy;
                }

                // Draw Elastic Cord connected from VERY BOTTOM CENTER to RING
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(bottomAnchorX, bottomAnchorY);

                const stretchDist = Math.hypot(ringX - bottomAnchorX, ringY - bottomAnchorY);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.lineWidth = Math.max(2, 6.5 - stretchDist / 180);
                ctx.shadowBlur = 18;
                ctx.shadowColor = '#ffffff';
                ctx.lineTo(ringX, ringY);
                ctx.stroke();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = Math.max(1.2, 2.8 - stretchDist / 350);
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ffffff';
                ctx.stroke();
                ctx.restore();

                // Draw Guide Dots at 1/5 (20%) and 3/5 (60%)
                if (!isBowCompleted) {
                    const y15 = baseRingY - (baseRingY - targetY) * 0.2;
                    const y35 = baseRingY - (baseRingY - targetY) * 0.6;

                    ctx.save();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.beginPath();
                    ctx.arc(targetX, y15, 3, 0, Math.PI * 2);
                    ctx.arc(targetX, y35, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // Draw Destination Top Dot
                ctx.save();
                const pulseScale = isBowCompleted ? 1.5 : (1 + Math.sin(time * 2) * 0.2);
                ctx.fillStyle = isBowCompleted ? 'rgba(229, 180, 9, 0.4)' : 'rgba(255, 255, 255, 0.15)';
                ctx.beginPath();
                ctx.arc(targetX, targetY, 14 * pulseScale, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = isBowCompleted ? '#E5B409' : '#ffffff';
                ctx.shadowBlur = 20;
                ctx.shadowColor = isBowCompleted ? '#E5B409' : '#ffffff';
                ctx.beginPath();
                ctx.arc(targetX, targetY, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Draw Ring
                ctx.save();
                ctx.lineWidth = 3.5;
                ctx.strokeStyle = isBowCompleted ? '#E5B409' : '#ffffff';
                ctx.fillStyle = (isDraggingRing || isBowCompleted) ? (isBowCompleted ? 'rgba(229, 180, 9, 0.25)' : 'rgba(255, 255, 255, 0.25)') : 'rgba(255, 255, 255, 0.05)';
                ctx.shadowBlur = (isDraggingRing || isBowCompleted) ? 25 : 15;
                ctx.shadowColor = isBowCompleted ? '#E5B409' : '#ffffff';

                ctx.beginPath();
                ctx.arc(ringX, ringY, ringRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.lineWidth = 1;
                ctx.strokeStyle = isBowCompleted ? 'rgba(229, 180, 9, 0.8)' : 'rgba(255, 255, 255, 0.6)';
                ctx.beginPath();
                ctx.arc(ringX, ringY, ringRadius - 6, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            // SCENE 2: STRING RENDER (#E5B409 GOLDEN STRING)
            if (currentScene === SCENE_STRING || currentScene === SCENE_TRANSITION) {
                const bgGlow = ctx.createRadialGradient(centerX, height / 2, 0, centerX, height / 2, height * 0.4);
                bgGlow.addColorStop(0, 'rgba(229, 180, 9, 0.04)');
                bgGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = bgGlow;
                ctx.fillRect(0, 0, width, height);

                const stiffness = isStringResetting ? 0.15 : 0.08;
                const dampingFactor = isStringResetting ? 0.65 : 0.94;

                if (!isDraggingString) {
                    for (let i = 1; i < NUM_NODES - 1; i++) {
                        nodes[i].update(stiffness, dampingFactor);
                    }

                    for (let pass = 0; pass < 2; pass++) {
                        for (let i = 1; i < NUM_NODES - 1; i++) {
                            const diffPrev = nodes[i - 1].x - nodes[i].x;
                            const diffNext = nodes[i + 1].x - nodes[i].x;
                            nodes[i].vx += (diffPrev + diffNext) * (isStringResetting ? 0.01 : 0.08);
                        }
                    }

                    if (isStringVibrating || isStringResetting) {
                        let maxDisplacement = 0;
                        let maxVelocity = 0;

                        for (let i = 1; i < NUM_NODES - 1; i++) {
                            const disp = Math.abs(nodes[i].x - nodes[i].baseX);
                            const vel = Math.abs(nodes[i].vx);
                            if (disp > maxDisplacement) maxDisplacement = disp;
                            if (vel > maxVelocity) maxVelocity = vel;
                        }

                        if (maxDisplacement < 0.2 && maxVelocity < 0.05) {
                            for (let i = 1; i < NUM_NODES - 1; i++) {
                                nodes[i].x = nodes[i].baseX;
                                nodes[i].vx = 0;
                            }
                            isStringVibrating = false;
                            isStringResetting = false;
                        }
                    }
                }

                // Draw Vertical Yellow (#E5B409) Spline String
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(nodes[0].x, nodes[0].y);

                for (let i = 0; i < NUM_NODES - 1; i++) {
                    const xc = (nodes[i].x + nodes[i + 1].x) / 2;
                    const yc = (nodes[i].y + nodes[i + 1].y) / 2;
                    ctx.quadraticCurveTo(nodes[i].x, nodes[i].y, xc, yc);
                }
                ctx.lineTo(nodes[NUM_NODES - 1].x, nodes[NUM_NODES - 1].y);

                // Golden Glow & Stroke (#E5B409)
                ctx.strokeStyle = isStringVibrating ? 'rgba(229, 180, 9, 0.45)' : 'rgba(229, 180, 9, 0.3)';
                ctx.lineWidth = 8;
                ctx.shadowBlur = isStringVibrating ? 25 : 20;
                ctx.shadowColor = '#E5B409';
                ctx.stroke();

                ctx.strokeStyle = '#E5B409';
                ctx.lineWidth = 2.5;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#E5B409';
                ctx.stroke();
                ctx.restore();

                // Golden Fixed Endpoints (#E5B409)
                ctx.save();
                ctx.fillStyle = '#E5B409';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#E5B409';

                ctx.beginPath();
                ctx.arc(nodes[0].x, nodes[0].y, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(nodes[NUM_NODES - 1].x, nodes[NUM_NODES - 1].y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Draw Shared Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Render Fade Transition Overlay
            if (currentScene === SCENE_TRANSITION && transitionProgress > 0) {
                ctx.save();
                ctx.fillStyle = `rgba(5, 5, 8, ${transitionProgress})`;
                ctx.fillRect(0, 0, width, height);
                ctx.restore();
            }

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
